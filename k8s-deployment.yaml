apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-api
  template:
    metadata:
      labels:
        app: post-api
    spec:
      containers:
      - name: post-api
        image: post-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev
---
apiVersion: v1
kind: Service
metadata:
  name: post-api-cluster
spec:
  type: ClusterIP
  selector:
    app: post-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: post-api-lb
spec:
  type: LoadBalancer
  selector:
    app: post-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080